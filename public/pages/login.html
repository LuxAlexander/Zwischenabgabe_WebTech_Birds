<!doctype html>
<html lang="de">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="./img/flower_icon.svg">
  <title>Anmelden – Sound DB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/styles.css">
  <link rel="stylesheet" href="./styles/authUser.css">
</head>

<body>

  <div class="auth-card" role="main">
    <div class="auth-header">
      <div class="brand">🐦 Sound DB <span>AUTHENTIFICATION</span></div>
      <h1>Vogelstimmen-Datenbank – Verwaltungszugang</h1>
    </div>

    <div class="tab-nav" role="tablist">
      <button class="tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="pane-login"
        onclick="switchTab('login')">
        Anmelden
      </button>
      <button class="tab-btn" id="tab-register" role="tab" aria-selected="false" aria-controls="pane-register"
        onclick="switchTab('register')">
        Registrieren
      </button>
    </div>

    <div class="auth-body">

      <!-- LOGIN PANE -->
      <div id="pane-login" class="tab-pane active" role="tabpanel" aria-labelledby="tab-login">
        <div class="alert-auth" id="login-alert" role="alert"></div>
        <div class="mb-3">
          <label class="form-label" for="login-username">Benutzername</label>
          <input type="text" class="form-control" id="login-username" placeholder="Dein Benutzername"
            autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="login-password">Passwort</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="login-password" placeholder="Dein Passwort"
              autocomplete="current-password" required style="padding-right: 2.5rem;">
            <button class="password-toggle" onclick="togglePassword('login-password', this)" type="button"
              aria-label="Passwort anzeigen">👁</button>
          </div>
        </div>
        <button class="btn-primary-auth" id="login-btn" onclick="handleLogin()">Anmelden</button>
        <p class="hint-text">Noch kein Konto? <a href="#" onclick="switchTab('register'); return false;">Jetzt
            registrieren →</a></p>
      </div>

      <!-- REGISTER PANE -->
      <div id="pane-register" class="tab-pane" role="tabpanel" aria-labelledby="tab-register">
        <div class="alert-auth" id="register-alert" role="alert"></div>
        <div class="mb-3">
          <label class="form-label" for="reg-username">Benutzername</label>
          <input type="text" class="form-control" id="reg-username" placeholder="Wähle einen Benutzernamen"
            autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="reg-password">Passwort</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="reg-password" placeholder="Mindestens 8 Zeichen"
              autocomplete="new-password" required style="padding-right: 2.5rem;" oninput="checkStrength(this.value)">
            <button class="password-toggle" onclick="togglePassword('reg-password', this)" type="button"
              aria-label="Passwort anzeigen">👁</button>
          </div>
          <div class="strength-bar" aria-hidden="true">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="reg-password2">Passwort bestätigen</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="reg-password2" placeholder="Passwort wiederholen"
              autocomplete="new-password" required style="padding-right: 2.5rem;">
            <button class="password-toggle" onclick="togglePassword('reg-password2', this)" type="button"
              aria-label="Passwort anzeigen">👁</button>
          </div>
        </div>
        <button class="btn-primary-auth" id="register-btn" onclick="handleRegister()">Konto erstellen</button>
        <p class="hint-text">Bereits registriert? <a href="#" onclick="switchTab('login'); return false;">Jetzt anmelden
            →</a></p>
      </div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/auth.js"></script>
</body>

</html>
