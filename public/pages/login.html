<!doctype html>
<html lang="de">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="./img/flower_icon.svg">
  <title>Anmelden – Sound DB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="authUser.css">
</head>
<body>

<div class="auth-card" role="main">
  <div class="auth-header">
    <div class="brand">🐦 Sound DB <span>AUTHENTIFICATION</span></div>
    <p>Vogelstimmen-Datenbank – Verwaltungszugang</p>
  </div>

  <div class="tab-nav" role="tablist">
    <button class="tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="pane-login" onclick="switchTab('login')">
      Anmelden
    </button>
    <button class="tab-btn" id="tab-register" role="tab" aria-selected="false" aria-controls="pane-register" onclick="switchTab('register')">
      Registrieren
    </button>
  </div>

  <div class="auth-body">

    <!-- LOGIN PANE -->
    <div id="pane-login" class="tab-pane active" role="tabpanel" aria-labelledby="tab-login">
      <div class="alert-auth" id="login-alert" role="alert"></div>
      <div class="mb-3">
        <label class="form-label" for="login-username">Benutzername</label>
        <input type="text" class="form-control" id="login-username" placeholder="Dein Benutzername" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="login-password">Passwort</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="login-password" placeholder="Dein Passwort" autocomplete="current-password" required style="padding-right: 2.5rem;">
          <button class="password-toggle" onclick="togglePassword('login-password', this)" type="button" aria-label="Passwort anzeigen">👁</button>
        </div>
      </div>
      <button class="btn-primary-auth" id="login-btn" onclick="handleLogin()">Anmelden</button>
      <p class="hint-text">Noch kein Konto? <a href="#" onclick="switchTab('register'); return false;">Jetzt registrieren →</a></p>
    </div>

    <!-- REGISTER PANE -->
    <div id="pane-register" class="tab-pane" role="tabpanel" aria-labelledby="tab-register">
      <div class="alert-auth" id="register-alert" role="alert"></div>
      <div class="mb-3">
        <label class="form-label" for="reg-username">Benutzername</label>
        <input type="text" class="form-control" id="reg-username" placeholder="Wähle einen Benutzernamen" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="reg-password">Passwort</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="reg-password" placeholder="Mindestens 8 Zeichen" autocomplete="new-password" required style="padding-right: 2.5rem;" oninput="checkStrength(this.value)">
          <button class="password-toggle" onclick="togglePassword('reg-password', this)" type="button" aria-label="Passwort anzeigen">👁</button>
        </div>
        <div class="strength-bar" aria-hidden="true"><div class="strength-fill" id="strength-fill"></div></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="reg-password2">Passwort bestätigen</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="reg-password2" placeholder="Passwort wiederholen" autocomplete="new-password" required style="padding-right: 2.5rem;">
          <button class="password-toggle" onclick="togglePassword('reg-password2', this)" type="button" aria-label="Passwort anzeigen">👁</button>
        </div>
      </div>
      <button class="btn-primary-auth" id="register-btn" onclick="handleRegister()">Konto erstellen</button>
      <p class="hint-text">Bereits registriert? <a href="#" onclick="switchTab('login'); return false;">Jetzt anmelden →</a></p>
    </div>

  </div>
</div>

<script>
  function switchTab(tab) {
    ['login', 'register'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      document.getElementById(`tab-${t}`).setAttribute('aria-selected', t === tab);
      document.getElementById(`pane-${t}`).classList.toggle('active', t === tab);
    });
    // Clear alerts on switch
    document.querySelectorAll('.alert-auth').forEach(el => {
      el.style.display = 'none';
      el.textContent = '';
    });
  }

  function togglePassword(id, btn) {
    const input = document.getElementById(id);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.textContent = isText ? '👁' : '🔒';
    btn.setAttribute('aria-label', isText ? 'Passwort anzeigen' : 'Passwort verbergen');
  }

  function showAlert(elId, message, type) {
    const el = document.getElementById(elId);
    el.textContent = message;
    el.className = `alert-auth alert-${type}`;
    el.style.display = 'block';
  }

  function checkStrength(pw) {
    const fill = document.getElementById('strength-fill');
    let score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/\d/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;

    const pct = Math.min(score * 20, 100);
    fill.style.width = pct + '%';
    fill.style.background = score <= 1 ? '#e74c3c' : score <= 3 ? '#f39c12' : '#27ae60';
  }

  async function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');

    if (!username || !password) {
      showAlert('login-alert', 'Bitte Benutzername und Passwort eingeben.', 'danger');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Anmelden…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.status === 401) {
        showAlert('login-alert', 'Falsches Passwort oder Benutzername nicht gefunden.', 'danger');
        return;
      }

      if (!res.ok) {
        showAlert('login-alert', data.error || 'Ein Fehler ist aufgetreten.', 'danger');
        return;
      }

      if (data.success) {
        showAlert('login-alert', 'Anmeldung erfolgreich! Weiterleitung…', 'success');
        setTimeout(() => { window.location.href = '/'; }, 800);
      }
    } catch (err) {
      showAlert('login-alert', 'Netzwerkfehler – bitte erneut versuchen.', 'danger');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Anmelden';
    }
  }

  async function handleRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    const btn = document.getElementById('register-btn');

    if (!username || !password) {
      showAlert('register-alert', 'Bitte alle Felder ausfüllen.', 'danger');
      return;
    }

    if (password.length < 8) {
      showAlert('register-alert', 'Das Passwort muss mindestens 8 Zeichen lang sein.', 'danger');
      return;
    }

    if (password !== password2) {
      showAlert('register-alert', 'Die Passwörter stimmen nicht überein.', 'danger');
      document.getElementById('reg-password2').classList.add('is-invalid');
      return;
    }

    document.getElementById('reg-password2').classList.remove('is-invalid');
    btn.disabled = true;
    btn.textContent = 'Konto wird erstellt…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.status === 401) {
        showAlert('register-alert', 'Dieser Benutzername ist bereits vergeben.', 'danger');
        return;
      }

      if (!res.ok) {
        showAlert('register-alert', data.error || 'Registrierung fehlgeschlagen.', 'danger');
        return;
      }

      if (data.success) {
        showAlert('register-alert', 'Konto erstellt! Weiterleitung…', 'success');
        setTimeout(() => { window.location.href = '/'; }, 800);
      }
    } catch (err) {
      showAlert('register-alert', 'Netzwerkfehler – bitte erneut versuchen.', 'danger');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Konto erstellen';
    }
  }

  // Submit on Enter
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const loginActive = document.getElementById('pane-login').classList.contains('active');
      if (loginActive) handleLogin();
      else handleRegister();
    }
  });
</script>
</body>
</html>
