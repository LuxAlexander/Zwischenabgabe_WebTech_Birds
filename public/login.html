<!doctype html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login/Registrierung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div id="app" class="container mt-5 text-center">
    <div class="card shadow-sm p-4 col-sm-12 col-md-8 col-lg-4 mx-auto">
      <h1 class="h3 mb-3 fw-normal">Login/Registrierung</h1>
      
      <form @submit.prevent="handleSubmit">
        <div class="mb-2">
          <input type="text" class="form-control" placeholder="Username" v-model="formData.username" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" placeholder="Passwort" v-model="formData.password" required>
        </div>
        <button class="w-100 btn btn-lg btn-primary" type="submit">Login/Registrierung</button>
      </form>
    </div>
  </div>

 <script type="module">
  import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

  createApp({
    setup() {
      const formData = ref({
        username: "",
        password: ""
      });

      const handleSubmit = () => {
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: formData.value.username,
            password: formData.value.password
          })
        })
        .then(async (res) => {
          // 1. Spezifische HTTP-Statuscodes abfangen
          if (res.status === 409) {
            // Falls der Server eine JSON-Fehlermeldung mitschickt:
            const data = await res.json();
            alert(data.error || "Dieser Benutzername ist bereits vergeben (409 Conflict).");
            return;
          }
          
          if (res.status === 401) {
            alert("Falsches Passwort oder Benutzername nicht gefunden (401 Unauthorized).");
            return;
          }
          return res.json();
        })
        .then(res => {
          if (res && res.success) {
            alert("Login/Registrierung erfolgreich!");
            window.location.href = "/geheim.html";
          }
        })
        .catch(err => {
          // Greift nur bei Netzwerkfehlern ODER wenn wir oben ein 'throw Error' geworfen haben
          console.error("Fehler beim Login/Registrierung:", err);
          alert("Ein Netzwerkfehler ist aufgetreten oder der Server ist offline.");
        });
      };

      return {
        formData,
        handleSubmit
      };
    }
  }).mount('#app')
</script>

</body>
</html>
